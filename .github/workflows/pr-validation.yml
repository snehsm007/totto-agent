name: PR Validation — Totto Mercedes F1 Fan Agent

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  ci-gate:
    name: Bundle, CXAS Lint (0 Warnings), Pytest & Multi-Layer Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Shared Prompt Bundle
        run: python3 scripts/bundle_shared_imports.py --check

      - name: Run Deterministic Unit, Contract & PIF Tests
        run: pytest -q

      - name: Run Multi-Layer Evaluation Gate (Tool + Public 9 AC + 4-Bucket Secret Holdout)
        run: python3 scripts/local_eval_runner.py --output evals/results/summary.json
